    <script>
      (function() {
        try {
          if (typeof window !== 'undefined') {
            // Gracefully handle Vite HMR WebSocket in AI Studio iframe/proxy environment
            var OrigWebSocket = window.WebSocket;
            if (OrigWebSocket) {
              window.WebSocket = function(url, protocols) {
                var isViteHmr = false;
                if (protocols === 'vite-hmr' || (Array.isArray(protocols) && protocols.indexOf('vite-hmr') !== -1)) {
                  isViteHmr = true;
                } else if (typeof url === 'string' && (url.indexOf('vite-hmr') !== -1 || (protocols === undefined && url.indexOf('/@vite/client') !== -1))) {
                  isViteHmr = true;
                }

                if (isViteHmr) {
                  var listeners = {};
                  var dummy = {
                    binaryType: 'blob',
                    bufferedAmount: 0,
                    extensions: '',
                    protocol: 'vite-hmr',
                    readyState: 1, // WebSocket.OPEN
                    url: url,
                    onopen: null,
                    onmessage: null,
                    onerror: null,
                    onclose: null,
                    addEventListener: function(type, listener) {
                      listeners[type] = listeners[type] || [];
                      listeners[type].push(listener);
                    },
                    removeEventListener: function(type, listener) {
                      if (listeners[type]) {
                        listeners[type] = listeners[type].filter(function(l) { return l !== listener; });
                      }
                    },
                    dispatchEvent: function(event) {
                      var list = listeners[event.type] || [];
                      for (var i = 0; i < list.length; i++) {
                        try { list[i].call(dummy, event); } catch(err) {}
                      }
                      return true;
                    },
                    send: function() {},
                    close: function() {
                      dummy.readyState = 3;
                    }
                  };

                  setTimeout(function() {
                    try {
                      if (typeof dummy.onopen === 'function') {
                        dummy.onopen(new Event('open'));
                      }
                      dummy.dispatchEvent(new Event('open'));
                    } catch(e) {}
                  }, 10);

                  return dummy;
                }

                return protocols !== undefined ? new OrigWebSocket(url, protocols) : new OrigWebSocket(url);
              };

              window.WebSocket.CONNECTING = OrigWebSocket.CONNECTING;
              window.WebSocket.OPEN = OrigWebSocket.OPEN;
              window.WebSocket.CLOSING = OrigWebSocket.CLOSING;
              window.WebSocket.CLOSED = OrigWebSocket.CLOSED;
              window.WebSocket.prototype = OrigWebSocket.prototype;
            }

            // Suppress benign Vite HMR WebSocket connection logs & errors in AI Studio iframe/proxy environment
            var origConsoleError = console.error;
            console.error = function() {
              var arg0 = arguments[0];
              var msg = (arg0 && (arg0.message || arg0.toString())) || '';
              if (
                msg.indexOf('WebSocket') !== -1 ||
                msg.indexOf('websocket') !== -1 ||
                (msg.indexOf('[vite]') !== -1 && (msg.indexOf('connect') !== -1 || msg.indexOf('server connection lost') !== -1))
              ) {
                return;
              }
              origConsoleError.apply(console, arguments);
            };

            window.addEventListener('unhandledrejection', function(event) {
              var r = event && event.reason;
              var msg = (r && (r.message || r.toString())) || '';
              if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('websocket') !== -1) {
                event.preventDefault();
                event.stopImmediatePropagation();
              }
            }, true);

            window.addEventListener('error', function(event) {
              var msg = (event && (event.message || (event.error && event.error.message))) || '';
              if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('websocket') !== -1) {
                event.preventDefault();
                event.stopImmediatePropagation();
                return true;
              }
            }, true);

            // Safeguard window.fetch against Chrome extension attempts to overwrite read-only getter
            var orig = typeof window.fetch === 'function' ? window.fetch.bind(window) : window.fetch;
            var curr = orig;
            var d = Object.getOwnPropertyDescriptor(window, 'fetch');
            if (!d || !d.set) {
              try {
                Object.defineProperty(window, 'fetch', {
                  configurable: true,
                  enumerable: true,
                  get: function() { return curr; },
                  set: function(v) { curr = typeof v === 'function' ? v : curr; }
                });
              } catch(e1) {
                try {
                  Object.defineProperty(window, 'fetch', {
                    value: orig,
                    writable: true,
                    configurable: true,
                    enumerable: true
                  });
                } catch(e2) {}
              }
            }
          }
        } catch(e) {}
      })();
    </script>
